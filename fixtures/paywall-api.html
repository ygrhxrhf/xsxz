<h2>第三十五章 旧桥</h2>
<p>旧桥比想象中窄，桥面的木板被雪泡得发黑，中间空了两块，往下能看见结着薄冰的河水。林舟把伞收拢，先迈出左脚试了试，木板响了一声，没有塌。</p>
<p>桥那头站着一个人，肩上落了厚厚一层雪，像是已经等了很久。他没有回头，只把手里的灯笼往上提了提，那点光落在桥面上，照出一条被踩出来的窄道。</p>
