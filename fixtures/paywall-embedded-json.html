<h2>第三十二章 石门</h2>
<p>石阶尽头的石门半开，门缝里透出一线昏黄的灯。林舟把伞收拢，抖落肩上的雪，抬脚踏进去时，脚下那块青砖发出一声闷响，像是从很深的地方传上来的回声。</p>
<p>他知道自己只走到这里便会被拦下。前面十二阶往上的地方，是宗门不许外人踏足的禁地，值夜的弟子站在台阶转角，手里提着一盏罩着铁网的灯。</p>

window.__INITIAL_STATE__ = {"chapter":{"id":32,"title":"第三十二章 石门","vip":true,"content":"他数着那盏灯晃动的次数，一次、两次，第三次时雪停了。值夜弟子的影子压在石阶上，被风扯得细长。林舟没有动，他在等一句话——宗门里所有人都知道的那句问话，只有答对了，才能往上再走一阶。\n\n上一位走到这里的人已经死了三年。那人当年也只差一阶，却在台阶上站了整整一夜，第二天清早被人抬下来时，手里还攥着一枚断了的铜铃，铃舌不知去了哪里。\n\n“林舟。”台阶上的人开口，声音被风吹散了一半，“你师叔当年也站在这儿。他说过一句话，你猜是什么。”风从门缝里灌进来，灯焰一矮，十二阶尽头的黑暗动了动，像有什么东西翻了个身。\n\n林舟把伞靠在石墙上，慢慢开口：“他说，这世上最难走的不是这十二阶，是走上去以后，还记得自己为什么上来。”台阶上安静了很久。值夜弟子侧过身，让出半条路，灯照见石阶上一道极浅的刻痕——有人用剑尖在上面写过字，又被风雨磨平了。他抬脚时，身后的雪忽然塌了一块，来路的脚印已经被新雪填平，像是从来没有人走过。\n\n风把灯吹灭了，可石阶尽头那点昏黄还在——不是灯的亮，是门后有人替他留着一线光。门后是一条长廊，两侧的石壁上刻满了名字，深浅不一，最新的那行还带着凿痕。他伸手摸过去，指尖沾了一层石粉，忽然明白为什么每个走上来的人都要留一行字：不是给后来人看，是给自己一个再往上走的理由。\n\n长廊尽头传来钟声，一声，两声，第三声时他停住了。守夜的长老不会在丑时敲钟，除非山门外又来了人。林舟把手按在剑柄上，听见自己的心跳和钟声叠在一起，慢慢变成同一个节奏。"}};
