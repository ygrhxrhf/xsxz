第三十章 剑出鞘

夜雨下了整夜，天亮时山道上全是碎叶。林舟把剑横在膝前，指节一点点收紧，远处传来马蹄声，由远及近。

他想起师父临终那句话：剑出鞘时，人已经没有退路。马蹄停在坡下，来人撑着伞，伞沿滴着水，看不清面容。

“把剑留下。”来人说话很轻，像在说一件无关紧要的事。

林舟没有答话，雨水顺着剑柄往下淌。他慢慢站起来，剑尖离地的那一瞬间，坡上的草全伏倒了。
