appId: com.spbf.novel
productName: 小说浏览器
copyright: Copyright © 2026
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - node_modules/**/*
  - "!node_modules/**/{test,tests,__tests__}/**"
  - "!node_modules/**/*.{md,ts,map}"
asar: true
# tesseract.js 会在运行时 fork worker 脚本，必须解包；语言包随 resources 一起发
asarUnpack:
  - "**/node_modules/tesseract.js/**"
  - "**/node_modules/tesseract.js-core/**"
extraResources:
  - from: resources
    to: resources
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 小说浏览器
