appId: com.spbf.novel
productName: 小说浏览器
copyright: Copyright © 2026
directories:
  output: release
  buildResources: build
# 复用已解压的 Electron：解压 zip 后 default_app.asar 会被 Windows Defender 锁住，
# 导致 electron-builder 的 rename/copy 持续 EPERM/EBUSY；直接复制本地 dist 可绕开。
electronDist: node_modules/electron/dist
files:
  - out/**/*
  - node_modules/**/*
  - "!node_modules/**/{test,tests,__tests__}/**"
  - "!node_modules/**/*.{md,ts,map}"
asar: true
# tesseract.js 会在运行时 fork worker 脚本，必须解包；语言包随 resources 一起发
asarUnpack:
  - "**/node_modules/tesseract.js/**"
  - "**/node_modules/tesseract.js-core/**"
extraResources:
  - from: resources
    to: resources
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 小说浏览器
