第七章 夜雨新章

夜雨斜斜地打在瓦檐上，张若尘推开窗，看见远处山脊被雷光切开一道白痕。他想起今日目录里忽然多出的这一章，心口既沉又热：这不是别人塞进书里的空白页，而是他自己走出来的路。廊下风铃轻响，他把从前六章里攒下的力气一点点理清，决定把这一夜写成可以通读的正文，好让后来人不用猜谜。山风带着湿土味灌进来，他在灯下写了很久，直到纸页边缘都被墨浸透。 章节标记OK7
